name: Flutter APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Android Projesini Hatasiz Uret
        run: flutter create . --platforms=android --org=com.example

      - name: Paketleri Getir
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: FrenAlgilayici-APK
          path: build/app/outputs/flutter-apk/app-release.apk
